plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version
    addModdingDependenciesTo(sourceSets.test)
}

dependencies {
    compileOnly("de.lardtom:propwash-common-${minecraft_version}:${propwash_version}")

    testImplementation("de.lardtom:propwash-common-${minecraft_version}:${propwash_version}")
    testImplementation('org.junit.jupiter:junit-jupiter:5.11.3')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
    testImplementation('org.joml:joml:1.10.9')
    testImplementation('com.google.code.gson:gson:2.14.0')
}

sourceSets {
    devtest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonDevtestJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
    commonDevtestResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

def langSourceDir = file('src/lang')
def langOutputDir = file("src/main/resources/assets/${mod_id}/lang")

tasks.register('mergeLang') {
    group = 'justmoreparts'
    description = 'Führt die Modul-Sprachdateien (src/lang/<modul>/<sprache>.json) zusammen.'
    inputs.dir(langSourceDir)
    doLast {
        def slurper = new groovy.json.JsonSlurper()
        def generator = new groovy.json.JsonGenerator.Options().disableUnicodeEscaping().build()
        Map<String, Map<String, String>> merged = new TreeMap<>()
        Map<String, Map<String, String>> origin = [:]
        def modules = (langSourceDir.listFiles() ?: []).findAll { it.isDirectory() }.sort { it.name }
        modules.each { moduleDir ->
            (moduleDir.listFiles() ?: []).findAll { it.name.endsWith('.json') }.sort { it.name }.each { file ->
                def language = file.name - '.json'
                def text = file.getText('UTF-8')
                def keysInFile = jmpJsonObjectKeys(text)
                def duplicatesInFile = keysInFile.countBy { it }.findAll { it.value > 1 }.keySet()
                if (!duplicatesInFile.isEmpty()) {
                    throw new GradleException("Doppelte Sprachschlüssel in ${file}: ${duplicatesInFile}")
                }
                def data = slurper.parseText(text)
                if (!(data instanceof Map)) {
                    throw new GradleException("${file} ist kein JSON-Objekt")
                }
                def target = merged.computeIfAbsent(language) { new TreeMap<String, String>() }
                def targetOrigin = origin.computeIfAbsent(language) { [:] }
                data.each { key, value ->
                    if (!(value instanceof String)) {
                        throw new GradleException("${file}: Wert von '${key}' ist kein String")
                    }
                    if (target.containsKey(key)) {
                        throw new GradleException("Doppelter Sprachschlüssel '${key}' (${language}) in den Modulen '${targetOrigin[key]}' und '${moduleDir.name}'")
                    }
                    target[key] = value
                    targetOrigin[key] = moduleDir.name
                }
            }
        }
        def allKeys = merged.values().collectMany { it.keySet() }.toSet()
        merged.each { language, entries ->
            def missing = (allKeys - entries.keySet()).sort()
            if (!missing.isEmpty()) {
                logger.warn("mergeLang: ${language} fehlen ${missing.size()} Schlüssel: ${missing}")
            }
        }
        langOutputDir.mkdirs()
        merged.each { language, entries ->
            def lines = entries.collect { key, value -> '  ' + generator.toJson(key) + ': ' + generator.toJson(value) }
            def json = lines.isEmpty() ? '{}\n' : '{\n' + lines.join(',\n') + '\n}\n'
            def out = new File(langOutputDir, "${language}.json")
            if (!out.exists() || out.getText('UTF-8') != json) {
                out.setText(json, 'UTF-8')
            }
        }
        logger.lifecycle("mergeLang: ${merged.collect { lang, entries -> "${lang}=${entries.size()}" }.join(', ')} aus ${modules.size()} Modulen")
    }
}

List<String> jmpJsonObjectKeys(String text) {
    List<String> keys = []
    int i = 0
    while (i < text.length()) {
        char c = text.charAt(i)
        if (c == '"' as char) {
            StringBuilder sb = new StringBuilder()
            i++
            while (i < text.length() && text.charAt(i) != ('"' as char)) {
                if (text.charAt(i) == ('\\' as char)) {
                    sb.append(text.charAt(i)).append(text.charAt(i + 1))
                    i += 2
                } else {
                    sb.append(text.charAt(i))
                    i++
                }
            }
            i++
            int j = i
            while (j < text.length() && Character.isWhitespace(text.charAt(j))) {
                j++
            }
            if (j < text.length() && text.charAt(j) == (':' as char)) {
                keys << sb.toString()
            }
        } else {
            i++
        }
    }
    return keys
}

tasks.matching { it.name in ['processResources', 'sourcesJar'] }.configureEach {
    dependsOn('mergeLang')
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonDevtestJava sourceSets.devtest.java.sourceDirectories.singleFile
    commonResources(sourceSets.main.resources.sourceDirectories.singleFile) {
        builtBy('mergeLang')
    }
    commonDevtestResources sourceSets.devtest.resources.sourceDirectories.singleFile
}

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'common')
            }
        }
    }
}

tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed'
        showStandardStreams = true
        exceptionFormat = 'full'
    }
}
